<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SpilarrOS</title>
  <style>
    @font-face { font-family: Sora; src: url(/font/sora.woff2) format("woff2"); font-weight: 400 800; font-display: swap; }
    :root { --bg: #0c0c0e; --panel: #141417; --raise: #1a1a1e; --raise2: #26262c; --line: #2a2a30; --text: #f2f0ea; --soft: #c9c5bc; --muted: #a3a09a;
      --accent: #ffc230; --ok: #57c98a; --warn: #e0a03a; --err: #e2685c; --r: 12px; --pad: 48px; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; user-select: none; }
    body { display: flex; flex-direction: column; background: var(--bg); color: var(--text); font: 15px/1.45 Sora, system-ui, "Segoe UI", sans-serif; }
    button, input, select { font: inherit; color: inherit; }
    button { background: none; border: 0; cursor: pointer; padding: 0; }
    button:disabled { opacity: .4; cursor: default; }
    h1, h2, p { margin: 0; }
    svg { flex: none; }
    .muted { color: var(--muted); }
    [hidden] { display: none !important; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 50px; padding: 0 22px; border-radius: 25px; border: 1px solid #4a4438; font-weight: 600; white-space: nowrap; }
    .btn:hover:not(:disabled) { background: var(--raise); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #15120a; font-weight: 700; font-size: 16px; padding: 0 26px; }
    .btn.primary:hover:not(:disabled) { background: #ffd060; }
    .btn.ghost { border-color: transparent; color: var(--soft); }
    .pill { display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 16px; border-radius: 22px; background: var(--raise); font-size: 14px; font-weight: 600; white-space: nowrap; }
    .pill:hover:not(:disabled) { background: var(--raise2); }
    .pill.line { background: none; border: 1px solid #34343a; }
    .icon { width: 44px; height: 44px; border-radius: 22px; display: inline-flex; align-items: center; justify-content: center; position: relative; flex: none; }
    .icon:hover:not(:disabled) { background: var(--raise2); }
    .icon.dot::after { content: ""; position: absolute; top: 9px; right: 9px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
    input, select { background: var(--raise); border: 1px solid transparent; border-radius: 22px; height: 44px; padding: 0 16px; outline: none; }
    input:focus, select:focus { border-color: #4a4438; }

    header { display: flex; align-items: center; gap: 32px; padding: 0 var(--pad); height: 68px; flex: none; position: relative; z-index: 5; }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; letter-spacing: -.02em; }
    .tabs { display: flex; gap: 26px; align-self: stretch; }
    .tabs button { color: var(--muted); font-weight: 500; border-bottom: 3px solid transparent; padding-top: 3px; white-space: nowrap; }
    .tabs button:hover { color: var(--text); }
    .tabs button.on { color: var(--text); border-color: var(--accent); }
    header .end { margin-left: auto; display: flex; align-items: center; gap: 12px; }
    .search { display: flex; align-items: center; gap: 10px; background: var(--raise); border-radius: 22px; padding: 0 16px; height: 44px; width: 230px; }
    .search input { background: none; border: 0; padding: 0; height: auto; width: 100%; border-radius: 0; font-size: 14px; }

    main { flex: 1; overflow-y: auto; position: relative; }
    main::-webkit-scrollbar { width: 10px; } main::-webkit-scrollbar-thumb { background: var(--raise2); border-radius: 5px; }
    .view { padding: 0 var(--pad) 28px; }

    /* Forside */
    .hero { position: relative; border-radius: 20px; background: #17130d; overflow: hidden; min-height: 340px; display: flex; }
    .hero > img, .banner > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 70% 30%; }
    .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, #17130d 0%, rgba(23,19,13,.94) 34%, rgba(23,19,13,.25) 78%); }
    .hero .txt { position: relative; z-index: 1; width: min(600px, 100%); padding: 36px 40px; display: flex; flex-direction: column; gap: 14px; }
    .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .14em; color: var(--accent); }
    .hero h1 { font-size: 50px; line-height: 1.02; font-weight: 800; letter-spacing: -.03em; overflow-wrap: anywhere; }
    .meta { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; font-size: 14px; color: var(--soft); }
    .meta i { font-style: normal; color: #6b6862; }
    .hero p, .gside p { color: var(--soft); max-width: 640px; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
    .hero .acts { display: flex; flex-wrap: wrap; gap: 12px; margin-top: auto; padding-top: 10px; }
    .shelf { margin-top: 26px; }
    .shelf .head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 14px; }
    h2 { font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
    .link { font-size: 13px; color: var(--muted); } .link:hover { color: var(--accent); }
    .row { display: flex; gap: 18px; overflow-x: auto; scrollbar-width: none; padding: 6px 6px 6px; margin: -6px; }
    .row::-webkit-scrollbar { display: none; }
    .row .card { width: 140px; flex: none; }

    /* Bibliotek */
    .chips { display: flex; gap: 8px; margin-bottom: 18px; overflow-x: auto; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chips button { height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid #34343a; color: var(--muted); font-size: 13px; font-weight: 500; white-space: nowrap; flex: none; }
    .chips button.on { background: var(--text); border-color: var(--text); color: #15120a; font-weight: 700; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 24px 20px; }
    .card { text-align: left; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
    .poster { position: relative; aspect-ratio: 2 / 3; border-radius: var(--r); overflow: hidden; background: #2a2416; display: block; width: 100%; }
    .card:hover .poster, .card:focus-visible .poster { outline: 3px solid var(--accent); outline-offset: 3px; }
    .poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .poster .ph { height: 100%; display: flex; align-items: flex-end; padding: 12px; color: #e6d3a3; font-weight: 800; font-size: 16px; line-height: 1.08; letter-spacing: -.02em; overflow-wrap: anywhere; }
    .card b { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card small { color: var(--muted); font-size: 12px; margin-top: -4px; }
    .badge { position: absolute; top: 8px; right: 8px; font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text); padding: 3px 7px; border-radius: 5px; background: rgba(12,12,14,.82); }
    .kan { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; flex: none; }
    .poster .kan { position: absolute; left: 8px; bottom: 8px; }
    .kan.ja { background: #173322; color: #7fe0a8; } .kan.min { background: #3a2a0e; color: #f0c06a; } .kan.nej { background: #3d1814; color: #f5a399; } .kan.ukendt { background: #26262c; color: var(--muted); }
    .kanpill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 8px; border-radius: 12px; font-weight: 600; font-size: 13px; }
    .kanpill.ja { background: #173322; color: #7fe0a8; } .kanpill.min { background: #3a2a0e; color: #f0c06a; } .kanpill.nej { background: #3d1814; color: #f5a399; } .kanpill.ukendt { background: #26262c; color: var(--muted); }
    .empty { color: var(--muted); padding: 60px 0; text-align: center; }

    /* Spilside */
    .banner { position: absolute; inset: 0; z-index: 0; overflow: hidden; background: var(--bg); }
    .gtop, .gbody { z-index: 1; }
    .banner::before { content: ""; position: absolute; inset: 0; z-index: 1; background: linear-gradient(90deg, var(--bg) 0%, rgba(12,12,14,.9) 38%, rgba(12,12,14,.5) 100%); }
    .banner::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 45%; z-index: 1; background: linear-gradient(180deg, rgba(12,12,14,0), var(--bg) 85%); }
    #game { position: relative; min-height: 100%; display: flex; flex-direction: column; }
    .gtop { position: relative; display: flex; align-items: center; gap: 20px; padding: 8px var(--pad) 0; }
    .gbody { position: relative; flex: 1; display: flex; gap: 44px; padding: 20px var(--pad) 28px; }
    .gleft { width: 300px; flex: none; display: flex; flex-direction: column; gap: 14px; }
    .gleft .poster { border-radius: 18px; box-shadow: 0 24px 60px rgba(0,0,0,.55); }
    .gleft .ph { font-size: 34px; padding: 22px; }
    .tags { display: flex; gap: 8px; flex-wrap: wrap; }
    .tags span { padding: 6px 12px; border-radius: 14px; background: rgba(26,26,30,.9); font-size: 12px; color: var(--soft); }
    .gside { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 18px; }
    .gside h1 { font-size: 46px; line-height: 1.03; font-weight: 800; letter-spacing: -.03em; overflow-wrap: anywhere; }
    .compat { border-radius: 16px; background: rgba(12,12,14,.72); border: 1px solid rgba(255,255,255,.08); padding: 18px 22px; display: flex; flex-direction: column; gap: 14px; }
    .compat .top { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; }
    .compat .top b { font-size: 16px; font-weight: 700; }
    .compat .top small { color: var(--muted); font-size: 13px; }
    .reqs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; font-size: 12.5px; line-height: 1.4; color: var(--soft); }
    .reqs > div { border-radius: 12px; background: rgba(255,255,255,.07); padding: 12px 14px; }
    .reqs b { display: block; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
    .reqs div div { overflow-wrap: anywhere; }
    .gacts { margin-top: auto; display: flex; flex-direction: column; gap: 12px; padding-top: 6px; }
    .gacts .btns { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
    .gacts .btn { height: 54px; border-radius: 27px; }
    .gacts select { height: 54px; border-radius: 27px; font-weight: 600; padding: 0 18px; }
    .space { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); }
    .space.err { color: #f5a399; }
    .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; display: block; }
    .bar i { display: block; height: 100%; background: var(--accent); }
    .space .bar { width: 220px; flex: none; } .space .bar i { background: #6b6862; }

    /* Statuslinje */
    footer { display: flex; align-items: center; gap: 6px 26px; padding: 0 var(--pad); min-height: 44px; flex: none; background: #121215; font-size: 13px; color: var(--muted); position: relative; z-index: 5; }
    footer .st::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; background: var(--ok); }
    footer .st.err { color: #f5a399; }
    footer .st.err::before { background: var(--err); }
    #mini { margin-left: auto; display: flex; align-items: center; gap: 14px; color: var(--text); min-width: 0; }
    #mini b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #mini .bar { width: 180px; flex: none; }
    #mini small { color: var(--muted); font-size: 13px; white-space: nowrap; }

    /* Downloads */
    #jobs { display: none; max-height: 48vh; overflow-y: auto; background: var(--panel); border-top: 1px solid var(--line); padding: 6px var(--pad) 10px; flex: none; position: relative; z-index: 5; }
    #jobs.on { display: block; }
    .job { display: flex; align-items: center; gap: 16px; padding: 14px 0; }
    .job + .job { border-top: 1px solid var(--line); }
    .job .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
    .job .jr { display: flex; justify-content: space-between; gap: 12px; }
    .job b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .job small { color: var(--muted); white-space: nowrap; }
    .job .err { color: #f5a399; white-space: normal; }
    .job .acts { display: flex; }
    .job .bar.ok i { background: var(--ok); } .job .bar.err i { background: var(--err); }

    /* Menu og dialoger */
    #menu { position: fixed; top: 64px; right: var(--pad); z-index: 15; background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
      padding: 8px; min-width: 240px; display: none; flex-direction: column; box-shadow: 0 16px 40px rgba(0,0,0,.6); }
    #menu.on { display: flex; }
    #menu button { text-align: left; padding: 12px 14px; border-radius: 10px; font-weight: 500; }
    #menu button:hover { background: var(--raise2); }
    #menu .new { color: var(--accent); font-weight: 700; }
    #ov { position: fixed; inset: 0; background: rgba(0,0,0,.66); display: none; align-items: center; justify-content: center; z-index: 20; }
    #ov.on { display: flex; }
    .box { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 30px; width: min(480px, 94vw); max-height: 90vh; overflow-y: auto;
      display: flex; flex-direction: column; gap: 16px; }
    .box h1 { font-size: 24px; font-weight: 800; letter-spacing: -.02em; padding-right: 44px; }
    .box > .icon.x { position: absolute; top: 16px; right: 16px; }
    .box .brow { display: flex; gap: 10px; }
    .box select, .box input { width: 100%; }
    .nets { display: flex; flex-direction: column; overflow-y: auto; max-height: 55vh; margin: 0 -10px; }
    .nets button { display: flex; justify-content: space-between; gap: 12px; padding: 14px 12px; border-radius: 10px; text-align: left; }
    .nets button:hover:not(:disabled) { background: var(--raise2); }
    .box.kode { width: min(760px, 94vw); }
    .kode input { flex: 1; min-width: 0; font-size: 18px; }
    .kb { display: flex; flex-direction: column; gap: 5px; }
    .kb div { display: flex; gap: 5px; justify-content: center; }
    .kb button { flex: 1; min-width: 0; padding: 12px 0; font-size: 17px; background: var(--raise2); border-radius: 8px; }
    .kb button.on { background: var(--accent); color: #15120a; }
    #toast { position: fixed; left: 50%; bottom: 64px; transform: translateX(-50%); background: var(--text); color: #15120a; font-weight: 600;
      padding: 12px 20px; border-radius: 24px; display: none; z-index: 30; max-width: 90vw; }

    /* Mobil: søg og menu på første linje, fanerne under, så de kan scrolles sidelæns */
    @media (max-width: 760px) {
      :root { --pad: 16px; }
      header { flex-wrap: wrap; gap: 4px 12px; height: auto; padding-top: 10px; }
      .logo span { display: none; }
      .search { flex: 1; width: auto; min-width: 0; }
      header .end { margin-left: 0; flex: 1; min-width: 0; }
      .tabs { order: 3; width: 100%; overflow-x: auto; scrollbar-width: none; gap: 22px; }
      .tabs::-webkit-scrollbar { display: none; }
      .tabs button { flex: none; height: 44px; }
      .hero { min-height: 0; }
      .hero::after { background: linear-gradient(180deg, rgba(23,19,13,.55) 0%, #17130d 62%); }
      .hero .txt { padding: 120px 20px 20px; }
      .hero h1 { font-size: 32px; }
      .hero .acts .btn { flex: 1; }
      .row .card { width: 118px; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 18px 12px; }
      .banner::before { background: linear-gradient(180deg, rgba(12,12,14,.6) 0%, var(--bg) 46%); }
      .gbody { flex-direction: column; gap: 18px; }
      .gleft { width: auto; flex-direction: row; align-items: flex-end; }
      .gleft .poster { width: 120px; flex: none; }
      .gleft .ph { font-size: 16px; padding: 10px; }
      .gside h1 { font-size: 30px; }
      .reqs { grid-template-columns: 1fr; }
      .gacts .btn, .gacts select { flex: 1 1 100%; }
      .space .bar { width: 90px; }
      footer { flex-wrap: wrap; padding-top: 8px; padding-bottom: 8px; }
      #mini { margin-left: 0; width: 100%; }
      #mini .bar { flex: 1; width: auto; }
      #menu { right: 16px; top: 58px; }
      .box { padding: 22px; }
    }
  </style>
</head>
<body>
  <header>
    <span class="logo"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 26 26" fill="none"><rect x="1.5" y="1.5" width="23" height="23" rx="7" stroke="#ffc230" stroke-width="2"/><path d="M13 7v9m0 0l-4-4m4 4l4-4M8 19.5h10" stroke="#ffc230" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>SpilarrOS</span></span>
    <nav class="tabs" id="kinds"></nav>
    <div class="end">
      <label class="search"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5" stroke="#a3a09a" stroke-width="1.8"/><path d="M11 11l3.5 3.5" stroke="#a3a09a" stroke-width="1.8" stroke-linecap="round"/></svg><input id="q" type="search" placeholder="Søg i biblioteket" aria-label="Søg i biblioteket" autocomplete="off"></label>
      <button class="pill line" id="dl" hidden></button>
      <button class="icon" id="more" title="Menu" aria-label="Menu" style="background: var(--raise)"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="#f2f0ea"><circle cx="3.5" cy="9" r="1.6"/><circle cx="9" cy="9" r="1.6"/><circle cx="14.5" cy="9" r="1.6"/></svg></button>
    </div>
  </header>
  <main id="main"></main>
  <div id="jobs"></div>
  <footer><span class="st" id="shome">Forbinder…</span><span class="st" id="snet"></span><span class="st" id="sdisk"></span><span class="st" id="stemp" hidden></span><button id="mini" hidden></button></footer>
  <div id="menu">
    <button class="new" data-m="opdater" hidden>Opdater SpilarrOS</button>
    <button data-m="wifi" hidden>Wifi</button>
    <button data-m="specs">Min PC</button>
    <button data-m="eject">Skub disk ud</button>
    <button data-m="off">Sluk</button>
  </div>
  <div id="ov"><div class="box" id="box"></div></div>
  <div id="toast"></div>
<script>
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gb = b => (b / 1e9).toFixed(1).replace('.', ',') + ' GB';
const dur = s => s < 60 ? Math.round(s) + ' s' : s < 3600 ? Math.round(s / 60) + ' min' : Math.floor(s / 3600) + ' t ' + Math.round(s % 3600 / 60) + ' min';
// view: hjem | spil | nyt | software | rom. sub: typefilter under Spil. gameId: åben spilside.
let games = [], view = 'hjem', sub = '', gameId = null, last = null, ny = false, shown = '';

const SVG = (d, w = 16, sw = 2) => `<svg aria-hidden="true" width="${w}" height="${w}" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const IC = {
  hent: SVG('<path d="M8 2v8m0 0L5 7m3 3l3-3M3 13h10"/>'),
  ja: SVG('<path d="M3 8.4l3.2 3.2L13 4.4"/>', 14), min: SVG('<path d="M3.5 8h9"/>', 14), nej: SVG('<path d="M4 4l8 8M12 4l-8 8"/>', 14),
  ukendt: SVG('<path d="M6 6a2 2 0 113 1.7c-.6.4-1 .8-1 1.6M8 12v.2"/>', 14),
  tilbage: SVG('<path d="M10 3L5 8l5 5"/>'), luk: SVG('<path d="M4 4l8 8M12 4l-8 8"/>'),
  igen: SVG('<path d="M13 8a5 5 0 11-1.5-3.5M13 2.5V5h-2.5"/>'), play: SVG('<path d="M5 3.5v9l7.5-4.5z" fill="currentColor"/>'),
  pause: SVG('<path d="M5.5 3.5v9M10.5 3.5v9"/>'), op: SVG('<path d="M4 10l4-4 4 4"/>'), ned: SVG('<path d="M4 6l4 4 4-4"/>'),
  laas: SVG('<rect x="3.5" y="7" width="9" height="6.5" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 015 0v2"/>', 14, 1.6),
  oje: SVG('<path d="M1.5 8S4 3.5 8 3.5 14.5 8 14.5 8 12 12.500 8 12.500 1.5 8 1.5 8z"/><circle cx="8" cy="8" r="2"/>', 18, 1.6),
};

function toast(t) { const e = $('#toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(e.t); e.t = setTimeout(() => e.style.display = 'none', 4000); }

async function post(url, body) {
  const r = await fetch(url, { method: 'POST', headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
  const t = await r.text();
  if (!r.ok) throw new Error(t || r.statusText);
  return t;
}

const KAN = { ja: 'Kører godt på din PC', min: 'Opfylder minimumskravene', nej: 'Kan næppe køre på din PC', ukendt: 'Kan ikke vurderes' };
const kanIcon = (k, why) => `<span class="kan ${k}" title="${esc(why || KAN[k])}">${IC[k]}</span>`;
const kanPill = g => g.kan ? `<span class="kanpill ${g.kan}" title="${esc(g.kan_why)}">${IC[g.kan]}${KAN[g.kan]}</span>` : '';
const badge = g => g.kind === 'rom' ? g.grp : g.label;
// Uden plakat: et farvet felt med titlen. Farven følger titlen, så den er den samme hver gang.
const FARVER = [['#2a2416', '#e6d3a3'], ['#1d2a22', '#b9dcc4'], ['#3a1616', '#ffb3a8'], ['#14283a', '#a9d4f5'], ['#26262b', '#d4d2dc'], ['#33200f', '#f4c9a0'], ['#2c1a33', '#e0bdf0']];
const farve = t => FARVER[[...t].reduce((n, c) => n + c.charCodeAt(0), 0) % FARVER.length];
const poster = g => `<span class="poster"${g.poster ? '' : ` style="background:${farve(g.title)[0]}"`}>${g.poster ? `<img loading="lazy" src="${esc(g.poster)}" alt="">` : `<span class="ph" style="color:${farve(g.title)[1]}">${esc(g.title)}</span>`}<span class="badge">${esc(badge(g))}</span>${g.kan ? kanIcon(g.kan, g.kan_why) : ''}</span>`;
const card = g => `<button class="card" data-id="${g.id}">${poster(g)}<b>${esc(g.title)}</b><small>${[g.year, gb(g.size)].filter(Boolean).join(' · ')}</small></button>`;
// Banneret ligger ved siden af plakaten på serveren; findes det ikke, fjernes billedet
const hero = g => g.poster ? `<img src="${esc(g.poster.replace(/poster$/, 'hero'))}" alt="" onerror="this.remove()">` : '';
const meta = g => [g.year, badge(g), gb(g.size)].filter(Boolean).map(esc).join('<i>·</i>');

// Nyt: kommet i biblioteket den sidste uge
const nyt = g => g.added && Date.now() / 1000 - g.added < 7 * 86400;
const erSpil = g => g.kind !== 'rom' && g.kind !== 'software';

// Kun de faner, biblioteket faktisk har indhold til
function tabs() {
  const t = [['hjem', 'Hjem'], ['spil', 'Spil']];
  if (games.some(g => erSpil(g) && nyt(g))) t.push(['nyt', 'Nyt']);
  if (games.some(g => g.kind === 'software')) t.push(['software', 'Software']);
  if (games.some(g => g.kind === 'rom')) t.push(['rom', 'Roms']);
  if (!t.some(([k]) => k === view)) view = 'hjem';
  $('#kinds').innerHTML = t.map(([k, l]) => `<button data-k="${k}" class="${k === view && !gameId ? 'on' : ''}">${l}</button>`).join('');
}

// ---------- Forside ----------
function homeHtml() {
  const spil = games.filter(erSpil).sort((a, b) => b.added - a.added);
  if (!spil.length) return gridHtml();
  const f = spil.find(g => g.poster) || spil[0];
  const shelf = (title, list, k) => list.length ? `<section class="shelf"><div class="head"><h2>${title}</h2><button class="link" data-k="${k}">Se alle</button></div><div class="row">${list.slice(0, 16).map(card).join('')}</div></section>` : '';
  return `<div class="view"><section class="hero">${hero(f)}<div class="txt">
      <div class="eyebrow">${nyt(f) ? 'NYT I BIBLIOTEKET' : 'SENEST TILFØJET'}</div>
      <h1>${esc(f.title)}</h1>
      <div class="meta">${meta(f)}${kanPill(f)}</div>
      ${f.short ? `<p>${esc(f.short)}</p>` : ''}
      <div class="acts" data-id="${f.id}"><button class="btn primary" data-h="">${IC.hent}Hent nu</button><button class="btn" data-h="02:00">Hent i nat kl. 02:00</button><button class="btn ghost" data-open>Detaljer</button></div>
    </div></section>
    ${shelf('Senest tilføjet', spil.filter(g => g !== f), 'spil')}
    ${shelf('Kører godt på din PC', spil.filter(g => g.kan === 'ja'), 'spil')}
    ${shelf('Software', games.filter(g => g.kind === 'software'), 'software')}</div>`;
}

// ---------- Bibliotek ----------
function gridHtml() {
  const t = $('#q').value.trim().toLowerCase();
  const inView = g => view === 'rom' ? g.kind === 'rom' : view === 'software' ? g.kind === 'software' : erSpil(g) && (view !== 'nyt' || nyt(g));
  const base = games.filter(g => inView(g) && (!t || (g.title + ' ' + (g.grp || '')).toLowerCase().includes(t)));
  // Under Spil kan der filtreres på type, under Roms på system
  const key = g => view === 'rom' ? g.grp : g.kind, lab = g => view === 'rom' ? g.grp : g.label;
  const kinds = view === 'spil' || view === 'rom' ? [...new Map(base.map(g => [key(g), lab(g)])).entries()] : [];
  if (sub && !kinds.some(([k]) => k === sub)) sub = '';
  const list = base.filter(g => !sub || key(g) === sub);
  if (view === 'nyt') list.sort((a, b) => b.added - a.added);
  const chips = kinds.length > 1 ? `<div class="chips">${[['', 'Alle'], ...kinds].map(([k, l]) => `<button data-s="${esc(k)}" class="${k === sub ? 'on' : ''}">${esc(l)}</button>`).join('')}</div>` : '';
  return `<div class="view">${chips}${list.length ? `<div class="grid">${list.map(card).join('')}</div>` : `<div class="empty">${games.length ? 'Ingen titler passer til søgningen' : 'Henter biblioteket…'}</div>`}</div>`;
}

// Starttid: næste gang klokken bliver det valgte, hver halve time. Huskes, så flere spil kan sættes i kø til samme tid.
let valgtStart = '';
const pad = n => String(n).padStart(2, '0');
const startOpts = () => '<option value="">Start nu</option>' + Array.from({ length: 48 }, (_, i) => {
  const t = `${pad(i >> 1)}:${i & 1 ? '30' : '00'}`;
  return `<option value="${t}">Start kl. ${t}</option>`;
}).join('');
function startTime(v) {
  if (!v) return 0;
  const [h, m] = v.split(':').map(Number), d = new Date();
  d.setHours(h, m, 0, 0);
  if (d <= new Date()) d.setDate(d.getDate() + 1);
  return d.getTime() / 1000;
}
const startTxt = s => new Date(s * 1000).toLocaleString('da-DK', { weekday: 'short', hour: '2-digit', minute: '2-digit' });

async function hent(g, f, startV, btn) {
  if (btn) btn.disabled = true;
  const start = startTime(startV);
  try { await post('/api/hent', { id: g.id, f: f || null, start }); toast(start ? `Starter ${startTxt(start)}` : 'Lagt i kø'); $('#jobs').classList.add('on'); poll(); return true; }
  catch (e) { toast(e.message); if (btn) btn.disabled = false; return false; }
}
// Én ISO hentes som fil; ellers hele mappen som zip
const standardFil = g => g.isos.length === 1 ? g.isos[0] : '';

// ---------- Spilside ----------
// Listen kan være gemt, før serveren sendte systemkrav
const reqs = (t, l) => l?.length ? `<div><b>${t}</b>${l.map(x => `<div>${esc(x)}</div>`).join('')}</div>` : '';

function spaceHtml(g) {
  const d = last && last.disk;
  if (!d || !d.ok) return `<div class="space err">${esc(d && d.msg || 'Ingen disk – sæt en USB-disk i')}</div>`;
  const nok = d.free > g.size + 5e8, brugt = d.total ? (1 - d.free / d.total) * 100 : 0;
  return `<div class="space${nok ? '' : ' err'}"><span class="bar"><i style="width:${brugt}%"></i></span><span>${gb(d.free)} fri på disken${nok ? ', så der er plads' : ' – der er ikke plads til hele mappen'}</span></div>`;
}

function gameHtml(g) {
  const name = f => f.split('/').pop();
  // En rom er én fil eller én zip (mappe eller .cue + .bin'er)
  const btns = g.kind === 'rom' ? `<button class="btn primary" data-f="${esc(g.isos[0] || '')}">${IC.hent}Hent · ${gb(g.size)}</button>`
    : g.isos.map((f, i) => `<button class="btn${i ? '' : ' primary'}" data-f="${esc(f)}">${i ? '' : IC.hent}Hent ${g.isos.length > 1 ? esc(name(f)) : 'ISO'}</button>`).join('')
    + `<button class="btn${g.isos.length ? '' : ' primary'}" data-f="">${g.isos.length ? '' : IC.hent}Hent hele mappen · ${gb(g.size)}</button>`;
  const fane = g.kind === 'rom' ? 'Roms' : g.kind === 'software' ? 'Software' : 'Spil';
  const harKrav = g.req_min?.length || g.req_rec?.length;
  return `<div id="game"><div class="banner">${hero(g)}</div>
    <div class="gtop"><button class="pill" id="back">${IC.tilbage}Tilbage</button><span class="muted">${fane} / ${esc(g.title)}</span></div>
    <div class="gbody"><div class="gleft">${poster(g)}${g.genres?.length ? `<div class="tags">${g.genres.slice(0, 4).map(x => `<span>${esc(x)}</span>`).join('')}</div>` : ''}</div>
    <div class="gside">
      <h1>${esc(g.title)}</h1>
      <div class="meta">${meta(g)}${nyt(g) ? '<i>·</i>Ny i biblioteket' : ''}</div>
      ${g.short ? `<p>${esc(g.short)}</p>` : ''}
      ${g.kan || harKrav ? `<div class="compat">${g.kan ? `<div class="top">${kanIcon(g.kan, g.kan_why)}<b>${KAN[g.kan]}</b><small>${esc(g.kan_why)}</small></div>` : ''}
        ${harKrav ? `<div class="reqs">${reqs('Minimum', g.req_min)}${reqs('Anbefalet', g.req_rec)}</div>` : ''}</div>` : ''}
      <div class="gacts"><div class="btns">${btns}<select id="start" aria-label="Starttid">${startOpts()}</select></div><div id="space">${spaceHtml(g)}</div></div>
    </div></div></div>`;
}

function render() {
  tabs();
  const g = gameId != null && games.find(x => x.id == gameId);
  const q = $('#q').value.trim();
  const key = g ? 'g' + g.id : view === 'hjem' && !q ? 'hjem' : 'grid';
  const m = $('#main'), top = key === shown ? m.scrollTop : 0;
  m.innerHTML = g ? gameHtml(g) : key === 'hjem' ? homeHtml() : gridHtml();
  m.scrollTop = top; shown = key;
  if (g) {
    $('#start').value = valgtStart;
    $('#start').onchange = e => valgtStart = e.target.value;
    $('#back').onclick = luk;
    $$('.gacts button').forEach(b => b.onclick = async () => { if (await hent(g, b.dataset.f, $('#start').value, b)) b.disabled = false; });
  }
  // Musehjulet ruller rækkerne sidelæns, når musen står på dem
  $$('.row').forEach(r => r.onwheel = e => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX) && r.scrollWidth > r.clientWidth) { r.scrollLeft += e.deltaY; e.preventDefault(); } });
}

// Spilsiden ligger i adressen (#spil/12), så telefonens tilbage-knap virker
const open = id => { location.hash = 'spil/' + id; };
const luk = () => { location.hash = ''; };
function route() { const m = location.hash.match(/^#spil\/(\d+)$/); gameId = m ? +m[1] : null; render(); }
window.addEventListener('hashchange', route);

function showBox(cls, html) {
  $('#box').className = 'box ' + cls;
  $('#box').innerHTML = `<button class="icon x" id="close" title="Luk" aria-label="Luk">${IC.luk}</button>` + html;
  $('#close').onclick = closeBox;
  $('#ov').classList.add('on');
}
function closeBox() { $('#ov').classList.remove('on'); $('#box').className = 'box'; }

async function openSpecs() {
  const s = await (await fetch('/api/specs')).json();
  const opts = (ph, l, v) => `<option value="">${ph}</option>` + l.map(x => `<option${x === v ? ' selected' : ''}>${esc(x)}</option>`).join('');
  const rams = [2, 4, 6, 8, 12, 16, 24, 32, 48, 64, 96, 128];
  showBox('', `<h1>Min PC</h1><p class="muted">Bruges til at vise, om et spil kan køre på den PC, det skal spilles på.</p>
    <select id="cpu" aria-label="Processor">${opts('Processor', s.cpus, s.pc.cpu)}</select>
    <select id="gpu" aria-label="Grafikkort">${opts('Grafikkort', s.gpus, s.pc.gpu)}</select>
    <select id="ram" aria-label="RAM"><option value="0">RAM</option>${rams.map(r => `<option value="${r}"${r === s.pc.ram ? ' selected' : ''}>${r} GB RAM</option>`).join('')}</select>
    <div class="brow"><button class="btn primary" id="save">Gem</button></div>`);
  $('#save').onclick = async () => {
    try { await post('/api/specs', { cpu: $('#cpu').value, gpu: $('#gpu').value, ram: +$('#ram').value }); closeBox(); toast('Gemt'); load(); }
    catch (e) { toast(e.message); }
  };
}

// ---------- Wifi ----------
const wifiBox = html => showBox('wifi', '<h1>Wifi</h1>' + html);

function askWifi() {
  wifiBox(`<p>Intet kabel. Forbind til wifi?</p>
    <div class="brow"><button class="btn primary" id="ja">Ja</button><button class="btn" id="nej">Nej</button></div>`);
  $('#ja').onclick = openWifi;
  $('#nej').onclick = closeBox;
}

async function openWifi() {
  wifiBox('<p class="muted">Søger…</p>');
  let s;
  try { const r = await fetch('/api/wifi'); if (!r.ok) throw new Error(await r.text()); s = await r.json(); }
  catch (e) { if ($('#ov').classList.contains('on')) wifiBox(`<p>${esc(e.message)}</p>`); return; }
  if (!$('#box').classList.contains('wifi')) return; // lukket imens
  wifiBox((s.list.length ? `<div class="nets">${s.list.map((n, i) => `<button data-i="${i}"><span style="display:flex;align-items:center;gap:8px">${n.kode ? IC.laas : ''}${esc(n.ssid)}${n.aktiv ? ' · forbundet' : ''}</span><span class="muted">${n.signal} %</span></button>`).join('')}</div>` : '<p class="muted">Ingen net fundet</p>')
    + '<div class="brow"><button class="btn" id="igen">Søg igen</button></div>');
  $('#igen').onclick = openWifi;
  $$('.nets button').forEach(b => b.onclick = () => {
    const n = s.list[b.dataset.i];
    if (n.gemt || !n.kode) connectWifi(n, ''); else askCode(n);
  });
}

async function connectWifi(n, pw) {
  wifiBox(`<p class="muted">Forbinder til ${esc(n.ssid)}…</p>`);
  try { toast(await post('/api/wifi', { ssid: n.ssid, pw })); closeBox(); poll(); }
  catch (e) { toast(e.message); if (n.kode) askCode(n); else openWifi(); }
}

// Skærmtastatur, da boksen kan bruges med kun en mus
const KB = [['1234567890', 'qwertyuiopå', 'asdfghjklæø', 'zxcvbnm'], ['!@#$%^&*()', '-_=+[]{}\\|', ';:\'",.<>/?', '`~€£§']];
function askCode(n) {
  let sym = 0, shift = false, pw = '';
  showBox('wifi kode', `<h1>${esc(n.ssid)}</h1>
    <div class="brow"><input id="pw" type="password" placeholder="Kode" aria-label="Kode" autocomplete="off"><button class="icon" id="vis" title="Vis kode" aria-label="Vis kode">${IC.oje}</button></div>
    <div class="kb" id="kb"></div>
    <div class="brow"><button class="btn primary" id="ok">Forbind</button><button class="btn" id="tilbage">Tilbage</button></div>`);
  const inp = $('#pw');
  inp.oninput = () => pw = inp.value;
  const keys = () => {
    const c = k => shift ? k.toUpperCase() : k;
    $('#kb').innerHTML = KB[sym].map(r => `<div>${[...r].map(k => `<button data-k="${esc(c(k))}">${esc(c(k))}</button>`).join('')}</div>`).join('')
      + `<div><button data-a="shift" class="${shift ? 'on' : ''}">⇧</button><button data-a="sym" class="${sym ? 'on' : ''}">!#1</button><button data-k=" " style="flex:4">␣</button><button data-a="slet">⌫</button></div>`;
  };
  keys();
  $('#kb').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.k) { pw += b.dataset.k; inp.value = pw; if (shift) { shift = false; keys(); } }
    else if (b.dataset.a === 'slet') { pw = pw.slice(0, -1); inp.value = pw; }
    else if (b.dataset.a === 'shift') { shift = !shift; keys(); }
    else if (b.dataset.a === 'sym') { sym = 1 - sym; keys(); }
  };
  $('#vis').onclick = () => inp.type = inp.type === 'password' ? 'text' : 'password';
  $('#tilbage').onclick = openWifi;
  $('#ok').onclick = () => { if (pw) connectWifi(n, pw); else inp.focus(); };
}

// Spørg én gang, når der ikke er net. Wifi får lidt tid til selv at koble på et gemt net, når kablet tages ud.
let udenNet = 0, spurgt = false;
function netCheck(n) {
  if (n.kabel || n.wifi) { udenNet = 0; spurgt = false; return; }
  if (n.wifi_kort && !spurgt && ++udenNet >= 8 && !$('#ov').classList.contains('on')) { spurgt = true; askWifi(); }
}

const stat = (id, ok, txt) => { const e = $(id); e.className = ok ? 'st' : 'st err'; e.textContent = txt; };
function status(s) {
  const n = s.net, d = s.disk;
  stat('#shome', s.server_ok, s.server_ok ? 'Forbundet hjem' : s.server_msg || 'Ingen forbindelse hjem');
  stat('#snet', (n.kabel || n.wifi) && !n.driver_mangler, (n.kabel ? 'Kabel' : n.wifi ? 'Wifi' : 'Intet net') + (n.driver_mangler ? ' · wifi-driveren mangler' : ''));
  stat('#sdisk', d.ok && d.fs !== 'vfat', !d.ok ? d.msg || 'Ingen disk' : `${gb(d.free)} fri` + (d.fs === 'vfat' ? ' · FAT32, maks 4 GB pr. fil' : ''));
  $('#stemp').hidden = s.temp == null;
  if (s.temp != null) stat('#stemp', s.temp < 80, `CPU ${Math.round(s.temp)} °C`);
}

const fart = j => `${(j.speed / 1e6).toFixed(1).replace('.', ',')} MB/s`;
function jobHtml(j) {
  const pct = j.size ? Math.min(100, j.done / j.size * 100) : 0;
  const af = `${gb(j.done)} af ${gb(j.size)}`;
  const senere = j.state === 'venter' && !j.pause && j.start * 1000 > Date.now();
  const st = j.pause ? `Pause · ${af}`
    : senere ? `${startTxt(j.start)} · ${gb(j.size)}`
    : j.state === 'henter' ? [af, fart(j), j.eta && dur(j.eta)].filter(Boolean).join(' · ')
    : { venter: `Venter · ${af}`, tjekker: 'Tjekker', faerdig: gb(j.size), fejl: af }[j.state];
  const aktiv = j.state === 'henter' || j.state === 'tjekker', ufaerdig = j.state !== 'faerdig';
  const a = (k, t, title) => `<button class="icon" data-a="${k}" data-n="${j.n}" title="${title}" aria-label="${title}">${t}</button>`;
  const acts = (j.state === 'fejl' ? a('igen', IC.igen, 'Prøv igen') : '')
    + (senere ? a('nu', IC.play, 'Start nu') : ufaerdig ? (j.pause ? a('pause', IC.play, 'Fortsæt') : a('pause', IC.pause, 'Pause')) : '')
    + (ufaerdig && !aktiv ? a('op', IC.op, 'Op') + a('ned', IC.ned, 'Ned') : '')
    + a('fjern', IC.luk, ufaerdig ? 'Fjern' : 'Skjul');
  const cls = j.state === 'faerdig' ? 'ok' : j.state === 'fejl' ? 'err' : '';
  return `<div class="job"><div class="info"><div class="jr"><b>${esc(j.title)}</b><small>${st}</small></div>
    <span class="bar ${cls}"><i style="width:${pct}%"></i></span>${j.msg ? `<small class="${j.state === 'fejl' ? 'err' : ''}">${esc(j.msg)}</small>` : ''}</div>
    <div class="acts">${acts}</div></div>`;
}

async function poll() {
  try {
    const s = await (await fetch('/api/status')).json(); last = s;
    netCheck(s.net);
    status(s);
    $('[data-m=wifi]').hidden = !s.net.wifi_kort || s.net.kabel;
    const act = s.jobs.filter(j => j.state !== 'faerdig'), cur = s.jobs.find(j => j.state === 'henter' || j.state === 'tjekker');
    $('#dl').hidden = !s.jobs.length;
    const pct = cur && cur.size ? Math.floor(cur.done / cur.size * 100) : 0;
    $('#dl').innerHTML = `<span style="color:var(--accent);display:flex">${IC.hent}</span>` + (cur && cur.state === 'henter' ? `${pct} %` + (act.length > 1 ? ` · ${act.length - 1} i kø` : '') : act.length ? `Downloads · ${act.length}` : 'Downloads');
    // Den aktive download står altid i statuslinjen
    $('#mini').hidden = !cur;
    if (cur) $('#mini').innerHTML = `<b>${esc(cur.title)}</b><span class="bar"><i style="width:${pct}%"></i></span><small>${cur.state === 'tjekker' ? 'Tjekker filen' : [`${pct} %`, fart(cur), cur.eta && dur(cur.eta) + ' tilbage'].filter(Boolean).join(' · ')}</small>`;
    // Næste i køen øverst, derefter de færdige med de nyeste først
    const done = s.jobs.filter(j => j.state === 'faerdig').reverse();
    $('#jobs').innerHTML = act.concat(done).map(jobHtml).join('');
    if (!s.jobs.length) $('#jobs').classList.remove('on');
    const g = gameId != null && games.find(x => x.id == gameId);
    if (g && $('#space')) $('#space').innerHTML = spaceHtml(g);
  } catch (e) { stat('#shome', false, 'Klienten svarer ikke'); }
}

$('#jobs').onclick = async e => {
  const b = e.target.closest('button[data-a]'); if (!b) return;
  if (b.dataset.a === 'fjern' && b.title === 'Fjern' && !confirm('Stop og slet den ufærdige download?')) return;
  try { await post(`/api/job/${b.dataset.n}/${b.dataset.a}`); poll(); } catch (err) { toast(err.message); }
};
$('#dl').onclick = $('#mini').onclick = () => $('#jobs').classList.toggle('on');
$('#main').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  const acts = b.closest('.hero .acts');
  if (acts) { const g = games.find(x => x.id == acts.dataset.id); if (!g) return; if ('open' in b.dataset) open(g.id); else hent(g, standardFil(g), b.dataset.h).then(ok => { if (ok) b.disabled = false; }); return; }
  if (b.classList.contains('card')) return open(b.dataset.id);
  if ('s' in b.dataset) { sub = b.dataset.s; render(); }
  else if (b.dataset.k) { view = b.dataset.k; sub = ''; render(); }
};
$('#q').oninput = () => { if (gameId != null) luk(); else render(); };
$('#kinds').onclick = e => { const b = e.target.closest('button'); if (!b) return; view = b.dataset.k; sub = ''; $('#q').value = ''; if (gameId != null) luk(); else render(); };

$('#more').onclick = e => { e.stopPropagation(); $('#menu').classList.toggle('on'); };
document.addEventListener('click', () => $('#menu').classList.remove('on'));
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('#ov').classList.contains('on')) closeBox(); else if (gameId != null) luk(); $('#menu').classList.remove('on'); } });
const MENU = {
  opdater: async () => {
    const henter = last && last.jobs.some(j => j.state === 'henter');
    if (!confirm(henter ? 'Downloaden afbrydes kort og fortsætter bagefter. Opdater?' : 'Opdater SpilarrOS?')) return;
    toast(await post('/api/opdatering')); setTimeout(() => location.reload(), 20000);
  },
  wifi: openWifi,
  specs: openSpecs,
  eject: async () => { toast(await post('/api/udskub')); poll(); },
  off: async () => {
    if (last && last.jobs.some(j => j.state === 'henter') && !confirm('Der hentes stadig. Downloaden fortsætter næste gang. Sluk?')) return;
    if (!confirm('Sluk SpilarrOS?')) return;
    toast(await post('/api/sluk'));
  },
};
$('#menu').onclick = async e => {
  const b = e.target.closest('button[data-m]'); if (!b) return;
  try { await MENU[b.dataset.m](); } catch (err) { toast(err.message); }
};
$('#ov').onclick = e => { if (e.target.id === 'ov') closeBox(); };

async function checkUpdate() {
  try { ny = (await (await fetch('/api/opdatering')).json()).ny; } catch (e) {}
  $('[data-m=opdater]').hidden = !ny;
  $('#more').classList.toggle('dot', ny);
}
checkUpdate(); setInterval(checkUpdate, 6 * 3600 * 1000);
document.addEventListener('contextmenu', e => e.preventDefault());

async function load() {
  try { games = await (await fetch('/api/spil')).json(); } catch (e) { games = []; }
  route();
  if (!games.length) setTimeout(load, 10000);
}
load(); poll(); setInterval(poll, 2000);
setInterval(load, 30 * 60 * 1000);
</script>
</body>
</html>
