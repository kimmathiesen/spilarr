name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: cargo test --release --locked

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # SpilarrOS-klienten til Raspberry Pi (arm64). Bygges i bookworm (glibc 2.36), så den kører på både
  # Raspberry Pi OS bookworm og trixie, og lægges på releasen "spilarros".
  pi:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container: rust:1-bookworm
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
    steps:
      - uses: actions/checkout@v4

      - name: Byg arm64
        run: |
          apt-get update && apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          rustup target add aarch64-unknown-linux-gnu
          cargo build --release --locked --target aarch64-unknown-linux-gnu
          cp target/aarch64-unknown-linux-gnu/release/spilarr spilarr-aarch64
          sha256sum spilarr-aarch64 > spilarr-aarch64.sha256

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: spilarros
          name: SpilarrOS-klient (arm64)
          body: Seneste build af `spilarr klient` til Raspberry Pi (64-bit). Opdateres ved hvert push til main.
          prerelease: true
          files: |
            spilarr-aarch64
            spilarr-aarch64.sha256
